<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Calc</title>
<link rel="manifest" href="/DNA1/calc-manifest.json">
<link rel="apple-touch-icon" href="/DNA1/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Calc">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap">
<style>
:root{--bg:#000;--f:#121726;--f2:#1a2035;--l:rgba(255,255,255,.14);--t:#f2f3f7;--m:#8a90a3;--ac:#f5c542;color-scheme:dark;box-sizing:border-box}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none}
html{height:100%}body{height:100%;background:var(--bg);color:var(--t);font:500 16px/1.3 Montserrat,system-ui,sans-serif;overflow:hidden;
padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#root{max-width:480px;height:100%;margin:0 auto;position:relative}
.scr{position:absolute;inset:0;display:none;flex-direction:column;padding:24px}
.scr.on{display:flex}
h1{font:800 26px Montserrat;margin-bottom:6px}
.sub{color:var(--m);font-size:14px;margin-bottom:22px}
input[type=text]{background:var(--f);border:1px solid var(--l);border-radius:14px;padding:16px;color:var(--t);font:600 17px Montserrat;width:100%}
.btn{margin-top:auto;background:var(--ac);color:#1a1400;border-radius:14px;padding:16px;font:700 16px Montserrat;text-align:center}
.cgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;overflow-y:auto;flex:1}
.cbtn{background:var(--f);border:1px solid var(--l);border-radius:14px;padding:12px 6px;text-align:center;font-size:13px}
.cbtn .fl{font-size:26px;display:block;margin-bottom:4px}
.cbtn.sel{outline:2px solid var(--ac)}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px}
#profBtn{background:var(--f);border:1px solid var(--l);border-radius:20px;padding:6px 12px;font:600 12px Montserrat;display:flex;gap:5px;align-items:center}
#tabs{display:flex;gap:6px;padding:0 16px 10px}
.tab{flex:1;text-align:center;padding:8px 0;border-radius:12px;font:600 12.5px Montserrat;color:var(--m);background:var(--f)}
.tab.on{background:var(--ac);color:#1a1400}
#pages{flex:1;min-height:0;display:flex;overflow:hidden}
.page{display:none;flex-direction:column;width:100%;min-height:0}
.page.on{display:flex}
#disp{padding:6px 22px 8px;text-align:right}
#exprLine{color:var(--m);font-size:14px;min-height:18px;overflow-wrap:anywhere}
#mainDisp{font:700 46px/1.05 Montserrat;overflow-wrap:anywhere;letter-spacing:-.5px}
#explain{color:var(--ac);font-size:12px;min-height:16px;margin-top:4px}
#pad{padding:6px 12px calc(12px + env(safe-area-inset-bottom,0px));overflow-y:auto}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:8px}
.grid button{aspect-ratio:1.7/1;border-radius:14px;border:1px solid var(--l);font:600 15px Montserrat;color:var(--t);background:var(--f2)}
.op{background:var(--ac);color:#1a1400;font-size:19px}
.fn{color:var(--m);font-size:12.5px;background:var(--f)}
.eq{background:var(--ac);color:#1a1400;font-size:20px}
.active{outline:2px solid var(--ac)}
#sciPad{display:none}
#sciPad.on{display:block}
#convPad{padding:14px 18px;overflow-y:auto;flex:1}
#catRow{display:flex;gap:8px;overflow-x:auto;padding-bottom:12px}
.cat{flex:0 0 auto;background:var(--f);border:1px solid var(--l);border-radius:12px;padding:8px 12px;font-size:13px;white-space:nowrap}
.cat.on{background:var(--ac);color:#1a1400}
.cfld{background:var(--f);border:1px solid var(--l);border-radius:14px;padding:14px;margin-bottom:10px}
.cfld input{background:transparent;border:0;color:var(--t);font:700 22px Montserrat;width:100%;margin-top:6px}
.cfld select{background:transparent;border:0;color:var(--ac);font:600 13px Montserrat;margin-top:6px}
#swapBtn{align-self:center;width:38px;height:38px;border-radius:50%;background:var(--f);border:1px solid var(--l);color:var(--ac);margin:2px auto}
#convExplain{color:var(--m);font-size:12.5px;text-align:center;margin-top:8px}
</style></head>
<body><div id="root">

<div id="onb1" class="scr on">
<h1>Привет 👋</h1><div class="sub">Как вас называть?</div>
<input type="text" id="nickIn" placeholder="Ваше имя">
<div class="btn" id="onb1next">Продолжить</div>
</div>

<div id="onb2" class="scr">
<h1>Ваша страна</h1><div class="sub">Чтобы сразу подставлять вашу валюту</div>
<div class="cgrid" id="countryGrid"></div>
<div class="btn" id="onb2next">Готово</div>
</div>

<div id="app" class="scr">
<header>
<button id="profBtn">👤 <span id="pNick">Гость</span> <span id="pFlag"></span></button>
</header>
<div id="tabs">
<div class="tab on" data-p="basic">Обычный</div>
<div class="tab" data-p="sci">Инженерный</div>
<div class="tab" data-p="conv">Конвертер</div>
</div>
<div id="pages">

<div class="page on" id="pg-basic">
<div id="disp"><div id="exprLine"></div><div id="mainDisp">0</div><div id="explain"></div></div>
<div id="pad"><div id="sciPad"><div class="grid" id="sciGrid"></div></div>
<div class="grid" id="basicGrid"></div></div>
</div>

<div class="page" id="pg-sci">
<div id="disp2"><div id="exprLine2"></div><div id="mainDisp2">0</div><div id="explain2"></div></div>
<div id="pad2"><div class="grid" id="sciGridFull"></div><div class="grid" id="basicGrid2"></div></div>
</div>

<div class="page" id="pg-conv">
<div id="convPad">
<div id="catRow"></div>
<div class="cfld"><div class="sub">Из</div><input type="text" id="cvFrom" value="1"><select id="unFrom"></select></div>
<div id="swapBtn">⇅</div>
<div class="cfld"><div class="sub">В</div><input type="text" id="cvTo" readonly><select id="unTo"></select></div>
<div id="convExplain"></div>
</div>
</div>

</div>
</div>
</div>

<script>
const $=s=>document.querySelector(s);
const COUNTRIES=[
['🇺🇦','Украина','UAH'],['🇺🇸','США','USD'],['🇬🇧','Британия','GBP'],['🇩🇪','Германия','EUR'],
['🇫🇷','Франция','EUR'],['🇵🇱','Польша','PLN'],['🇮🇹','Италия','EUR'],['🇪🇸','Испания','EUR'],
['🇳🇱','Нидерланды','EUR'],['🇨🇦','Канада','CAD'],['🇦🇺','Австралия','AUD'],['🇹🇷','Турция','TRY'],
['🇨🇿','Чехия','CZK'],['🇸🇪','Швеция','SEK'],['🇳🇴','Норвегия','NOK'],['🇯🇵','Япония','JPY'],
['🇨🇳','Китай','CNY'],['🇮🇳','Индия','INR'],['🇧🇷','Бразилия','BRL'],['🇰🇿','Казахстан','KZT'],
['🇬🇪','Грузия','GEL'],['🇮🇱','Израиль','ILS'],['🇨🇭','Швейцария','CHF'],['🇦🇪','ОАЭ','AED'],
];
$('#countryGrid').innerHTML=COUNTRIES.map((c,i)=>`<button class="cbtn" data-i="${i}"><span class="fl">${c[0]}</span>${c[1]}</button>`).join('');
let chosenCountry=null;
$('#countryGrid').onclick=e=>{const b=e.target.closest('.cbtn');if(!b)return;
 [...document.querySelectorAll('.cbtn')].forEach(x=>x.classList.remove('sel'));b.classList.add('sel');
 chosenCountry=COUNTRIES[+b.dataset.i]};

function show(id){['onb1','onb2','app'].forEach(s=>$('#'+s).classList.toggle('on',s===id))}
const savedNick=localStorage.getItem('calcNick'),savedCountry=localStorage.getItem('calcCountry');
if(savedNick&&savedCountry){const c=JSON.parse(savedCountry);$('#pNick').textContent=savedNick;$('#pFlag').textContent=c[0];show('app');initConv(c[2])}

$('#onb1next').onclick=()=>{const n=$('#nickIn').value.trim();if(!n)return;localStorage.setItem('calcNick',n);show('onb2')};
$('#onb2next').onclick=()=>{if(!chosenCountry)chosenCountry=COUNTRIES[0];localStorage.setItem('calcCountry',JSON.stringify(chosenCountry));
 $('#pNick').textContent=localStorage.getItem('calcNick');$('#pFlag').textContent=chosenCountry[0];show('app');initConv(chosenCountry[2])};
$('#profBtn').onclick=()=>{const n=prompt('Ваше имя?',localStorage.getItem('calcNick')||'');if(n){localStorage.setItem('calcNick',n);$('#pNick').textContent=n}};

document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
 document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));t.classList.add('on');
 document.querySelectorAll('.page').forEach(x=>x.classList.remove('on'));$('#pg-'+t.dataset.p).classList.add('on')});

/* ===== calculator engine (shared, works for both basic & sci pages via suffix) ===== */
function mkCalc(suf){
 let acc=null,op=null,cur='0',fresh=false,M=0,deg=true,sec=false;
 const disp=$('#mainDisp'+suf),exprEl=$('#exprLine'+suf),expEl=$('#explain'+suf);
 const fmt=n=>{if(!isFinite(n))return'Ошибка';let s=+n.toPrecision(10);return String(s)};
 const D=()=>disp.textContent=cur.length>11?(+cur).toExponential(4):cur;
 const EL=t=>exprEl.textContent=t; const EX=t=>expEl.textContent=t||'';
 function compute(a,o,b){switch(o){case'+':return a+b;case'-':return a-b;case'×':return a*b;
  case'÷':return b===0?NaN:a/b;case'^':return Math.pow(a,b);case'mod':return a%b;
  case'yroot':return Math.pow(a,1/b);case'gcd':{a=Math.round(a);b=Math.round(b);while(b){[a,b]=[b,a%b]}return Math.abs(a)}
  case'lcm':{const g=compute(a,'gcd',b);return Math.abs(a*b)/g}}}
 function digit(d){if(fresh||cur==='0'&&d!=='.'){cur=(d==='.')?'0.':d;fresh=false}
  else{if(d==='.'&&cur.includes('.'))return;cur+=d}D()}
 function pressOp(o){if(op&&!fresh){acc=compute(acc,op,parseFloat(cur))}else{acc=parseFloat(cur)}
  op=o;fresh=true;EL(fmt(acc)+' '+o);cur=fmt(acc);D();EX('')}
 function equals(){if(op==null)return;const b=parseFloat(cur),a=acc,o=op,r=compute(a,o,b);
  EL(fmt(a)+' '+o+' '+fmt(b)+' =');cur=fmt(r);
  if(['^','mod','yroot','gcd','lcm'].includes(o)){const names={'^':'степень','mod':'остаток от деления','yroot':'корень степени','gcd':'НОД','lcm':'НОК'};
   EX(`${fmt(a)} ${o} ${fmt(b)} = ${fmt(r)} — ${names[o]}`)}else EX('');
  op=null;acc=null;fresh=true;D()}
 function ac(){acc=null;op=null;cur='0';fresh=false;EL('');EX('');D()}
 function back(){cur=cur.length>1?cur.slice(0,-1):'0';D()}
 function pm(){cur=fmt(-parseFloat(cur));D()}
 function pct(){cur=fmt(parseFloat(cur)/100);D()}
 const RAD=v=>deg?v*Math.PI/180:v, DEG=v=>deg?v*180/Math.PI:v;
 const uf={
  sqrt:v=>({r:Math.sqrt(v),t:`√${fmt(v)} = ${fmt(Math.sqrt(v))} — квадратный корень`}),
  cbrt:v=>({r:Math.cbrt(v),t:`∛${fmt(v)} = ${fmt(Math.cbrt(v))} — кубический корень`}),
  sq:v=>({r:v*v,t:`${fmt(v)}² = ${fmt(v*v)} — квадрат числа`}),
  cube:v=>({r:v*v*v,t:`${fmt(v)}³ = ${fmt(v*v*v)} — куб числа`}),
  inv:v=>({r:1/v,t:`1/${fmt(v)} = ${fmt(1/v)} — обратное число`}),
  abs:v=>({r:Math.abs(v),t:`|${fmt(v)}| = ${fmt(Math.abs(v))} — модуль`}),
  ln:v=>({r:Math.log(v),t:`ln(${fmt(v)}) = ${fmt(Math.log(v))} — натур. логарифм`}),
  log:v=>({r:Math.log10(v),t:`log(${fmt(v)}) = ${fmt(Math.log10(v))} — десятич. логарифм`}),
  exp:v=>({r:Math.exp(v),t:`e^${fmt(v)} = ${fmt(Math.exp(v))}`}),
  pow10:v=>({r:Math.pow(10,v),t:`10^${fmt(v)} = ${fmt(Math.pow(10,v))}`}),
  fact:v=>{v=Math.round(v);let f=1;for(let i=2;i<=v;i++)f*=i;return{r:f,t:`${v}! = ${fmt(f)} — факториал`}},
  floor:v=>({r:Math.floor(v),t:`⌊${fmt(v)}⌋ = ${Math.floor(v)} — округление вниз`}),
  ceil:v=>({r:Math.ceil(v),t:`⌈${fmt(v)}⌉ = ${Math.ceil(v)} — округление вверх`}),
  round:v=>({r:Math.round(v),t:`round(${fmt(v)}) = ${Math.round(v)}`}),
  sign:v=>({r:Math.sign(v),t:`sign(${fmt(v)}) = ${Math.sign(v)} — знак числа`}),
  sin:v=>sec?{r:DEG(Math.asin(v)),t:`asin(${fmt(v)}) = ${fmt(DEG(Math.asin(v)))}°`}:{r:Math.sin(RAD(v)),t:`sin(${fmt(v)}°) = ${fmt(Math.sin(RAD(v)))}`},
  cos:v=>sec?{r:DEG(Math.acos(v)),t:`acos(${fmt(v)}) = ${fmt(DEG(Math.acos(v)))}°`}:{r:Math.cos(RAD(v)),t:`cos(${fmt(v)}°) = ${fmt(Math.cos(RAD(v)))}`},
  tan:v=>sec?{r:DEG(Math.atan(v)),t:`atan(${fmt(v)}) = ${fmt(DEG(Math.atan(v)))}°`}:{r:Math.tan(RAD(v)),t:`tan(${fmt(v)}°) = ${fmt(Math.tan(RAD(v)))}`},
  sinh:v=>sec?{r:Math.asinh(v),t:`asinh(${fmt(v)}) = ${fmt(Math.asinh(v))}`}:{r:Math.sinh(v),t:`sinh(${fmt(v)}) = ${fmt(Math.sinh(v))}`},
  cosh:v=>sec?{r:Math.acosh(v),t:`acosh(${fmt(v)}) = ${fmt(Math.acosh(v))}`}:{r:Math.cosh(v),t:`cosh(${fmt(v)}) = ${fmt(Math.cosh(v))}`},
  tanh:v=>sec?{r:Math.atanh(v),t:`atanh(${fmt(v)}) = ${fmt(Math.atanh(v))}`}:{r:Math.tanh(v),t:`tanh(${fmt(v)}) = ${fmt(Math.tanh(v))}`},
 };
 function unary(key){const v=parseFloat(cur),{r,t}=uf[key](v);cur=fmt(r);fresh=true;D();EX(t)}
 function konst(v,label){cur=fmt(v);fresh=true;D();EX(`${label} = ${fmt(v)}`)}
 function rnd(){cur=fmt(Math.random());fresh=true;D();EX('Случайное число от 0 до 1')}
 function memo(k){const v=parseFloat(cur);if(k==='m+')M+=v;if(k==='m-')M-=v;if(k==='mr'){cur=fmt(M);fresh=true;D()}if(k==='mc')M=0}
 return{digit,pressOp,equals,ac,back,pm,pct,unary,konst,rnd,memo,
  toggleSec(btn){sec=!sec;btn.classList.toggle('active')},
  toggleDeg(btn){deg=!deg;btn.textContent=deg?'Deg':'Rad'}};
}
const C1=mkCalc(''), C2=mkCalc('2');

function attach(id,C,defs){const el=$(id);el.innerHTML=defs.map(b=>`<button class="${b[2]}">${b[0]}</button>`).join('');
 [...el.children].forEach((btn,i)=>btn.onclick=function(){defs[i][3](C,this)})}

const BD=[
 ['AC',,'fn',C=>C.ac()],['+/-',,'fn',C=>C.pm()],['%',,'fn',C=>C.pct()],['÷',,'op',C=>C.pressOp('÷')],
 ['7',,'fn',C=>C.digit('7')],['8',,'fn',C=>C.digit('8')],['9',,'fn',C=>C.digit('9')],['×',,'op',C=>C.pressOp('×')],
 ['4',,'fn',C=>C.digit('4')],['5',,'fn',C=>C.digit('5')],['6',,'fn',C=>C.digit('6')],['−',,'op',C=>C.pressOp('-')],
 ['1',,'fn',C=>C.digit('1')],['2',,'fn',C=>C.digit('2')],['3',,'fn',C=>C.digit('3')],['+',,'op',C=>C.pressOp('+')],
 ['⌫',,'fn',C=>C.back()],['0',,'fn',C=>C.digit('0')],['.',,'fn',C=>C.digit('.')],['=',,'eq',C=>C.equals()],
];
const SD=[
 ['2nd',,'fn',(C,b)=>C.toggleSec(b)],['Deg',,'fn',(C,b)=>C.toggleDeg(b)],['mod',,'fn',C=>C.pressOp('mod')],['xʸ',,'fn',C=>C.pressOp('^')],
 ['x²',,'fn',C=>C.unary('sq')],['x³',,'fn',C=>C.unary('cube')],['√x',,'fn',C=>C.unary('sqrt')],['∛x',,'fn',C=>C.unary('cbrt')],
 ['1/x',,'fn',C=>C.unary('inv')],['|x|',,'fn',C=>C.unary('abs')],['n!',,'fn',C=>C.unary('fact')],['ʸ√x',,'fn',C=>C.pressOp('yroot')],
 ['ln',,'fn',C=>C.unary('ln')],['log',,'fn',C=>C.unary('log')],['eˣ',,'fn',C=>C.unary('exp')],['10ˣ',,'fn',C=>C.unary('pow10')],
 ['sin',,'fn',C=>C.unary('sin')],['cos',,'fn',C=>C.unary('cos')],['tan',,'fn',C=>C.unary('tan')],['π',,'fn',C=>C.konst(Math.PI,'π')],
 ['sinh',,'fn',C=>C.unary('sinh')],['cosh',,'fn',C=>C.unary('cosh')],['tanh',,'fn',C=>C.unary('tanh')],['e',,'fn',C=>C.konst(Math.E,'e')],
 ['⌊x⌋',,'fn',C=>C.unary('floor')],['⌈x⌉',,'fn',C=>C.unary('ceil')],['round',,'fn',C=>C.unary('round')],['sign',,'fn',C=>C.unary('sign')],
 ['mc',,'fn',C=>C.memo('mc')],['m+',,'fn',C=>C.memo('m+')],['m-',,'fn',C=>C.memo('m-')],['mr',,'fn',C=>C.memo('mr')],
 ['Rand',,'fn',C=>C.rnd()],['gcd',,'fn',C=>C.pressOp('gcd')],['lcm',,'fn',C=>C.pressOp('lcm')],['φ',,'fn',C=>C.konst(1.6180339887,'φ')],
];
attach('#basicGrid',C1,BD); attach('#sciGrid',C1,SD);
attach('#basicGrid2',C2,BD); attach('#sciGridFull',C2,SD);

/* ===== converter ===== */
const CONV={
 length:{label:'Длина',emoji:'📏',u:{'м':1,'км':1000,'см':.01,'мм':.001,'миля':1609.34,'ярд':.9144,'фут':.3048,'дюйм':.0254}},
 weight:{label:'Вес',emoji:'⚖️',u:{'кг':1,'г':.001,'мг':.000001,'т':1000,'фунт':.453592,'унция':.0283495}},
 volume:{label:'Объём',emoji:'🧴',u:{'л':1,'мл':.001,'м³':1000,'галлон':3.78541,'кварта':.946353,'пинта':.473176}},
 area:{label:'Площадь',emoji:'📐',u:{'м²':1,'км²':1e6,'см²':1e-4,'га':10000,'акр':4046.86}},
 speed:{label:'Скорость',emoji:'🚀',u:{'м/с':1,'км/ч':.277778,'миль/ч':.44704,'узел':.514444}},
 time:{label:'Время',emoji:'⏱️',u:{'сек':1,'мин':60,'час':3600,'день':86400,'неделя':604800,'месяц':2628000,'год':31536000}},
 data:{label:'Данные',emoji:'💾',u:{'бит':.125,'байт':1,'КБ':1024,'МБ':1048576,'ГБ':1073741824,'ТБ':1099511627776}},
};
const TEMPU=['°C','°F','K'];
function toC(v,u){return u==='°C'?v:u==='°F'?(v-32)*5/9:v-273.15}
function fromC(v,u){return u==='°C'?v:u==='°F'?v*9/5+32:v+273.15}
let RATES={USD:1,EUR:.92,GBP:.79,UAH:41.5,PLN:4.0,CZK:23.5,TRY:34.2,CNY:7.25,JPY:149,INR:83.4,CAD:1.37,AUD:1.53,CHF:.88,SEK:10.4,NOK:10.6,KZT:478,GEL:2.68,ILS:3.72,AED:3.67,BRL:5.15};
fetch('https://open.er-api.com/v6/latest/USD').then(r=>r.json()).then(d=>{if(d&&d.rates){for(const k in RATES)if(d.rates[k])RATES[k]=d.rates[k];if(curCat==='currency')renderCat()}}).catch(()=>{});
const CURR=Object.keys(RATES);
let curCat='currency',homeCurr='USD';
function initConv(currCode){homeCurr=currCode||'USD';renderCatRow();renderCat()}
function renderCatRow(){const list=[['currency','💱','Валюта'],['temperature','🌡️','Температура'],...Object.keys(CONV).map(k=>[k,CONV[k].emoji,CONV[k].label])];
 $('#catRow').innerHTML=list.map(c=>`<div class="cat${c[0]===curCat?' on':''}" data-c="${c[0]}">${c[1]} ${c[2]}</div>`).join('');
 [...document.querySelectorAll('.cat')].forEach(el=>el.onclick=()=>{curCat=el.dataset.c;renderCatRow();renderCat()})}
function unitsFor(cat){if(cat==='currency')return CURR;if(cat==='temperature')return TEMPU;return Object.keys(CONV[cat].u)}
function renderCat(){const units=unitsFor(curCat);
 $('#unFrom').innerHTML=units.map(u=>`<option${u===(curCat==='currency'?homeCurr:units[0])?' selected':''}>${u}</option>`).join('');
 $('#unTo').innerHTML=units.map(u=>`<option${u===(curCat==='currency'?(homeCurr==='USD'?'EUR':'USD'):units[1]||units[0])?' selected':''}>${u}</option>`).join('');
 $('#cvFrom').value='1';doConv()}
function doConv(){const v=parseFloat($('#cvFrom').value)||0,f=$('#unFrom').value,t=$('#unTo').value;let r;
 if(curCat==='currency'){r=v*(RATES[t]/RATES[f]);$('#convExplain').textContent=`1 ${f} ≈ ${(RATES[t]/RATES[f]).toFixed(4)} ${t} · курс может быть неточным`}
 else if(curCat==='temperature'){r=fromC(toC(v,f),t);$('#convExplain').textContent=`${v}${f} = ${r.toFixed(2)}${t}`}
 else{const u=CONV[curCat].u;r=v*u[f]/u[t];$('#convExplain').textContent=`1 ${f} = ${(u[f]/u[t]).toPrecision(6)} ${t}`}
 $('#cvTo').value=isFinite(r)?(+r.toPrecision(8)):'Ошибка'}
$('#cvFrom').oninput=doConv;$('#unFrom').onchange=doConv;$('#unTo').onchange=doConv;
$('#swapBtn').onclick=()=>{const f=$('#unFrom').value,t=$('#unTo').value;$('#unFrom').value=t;$('#unTo').value=f;doConv()};
</script>
</body></html>
